name: CI (.NET)

on:
  push:
    branches: [main]
    paths:
      - 'dotnet/**'
      - 'conformance/**'
      - '.github/workflows/ci-dotnet.yml'
  pull_request:
    paths:
      - 'dotnet/**'
      - 'conformance/**'
      - '.github/workflows/ci-dotnet.yml'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build dotnet/TingQR.slnx -c Release
      - run: dotnet test dotnet/TingQR.slnx -c Release
