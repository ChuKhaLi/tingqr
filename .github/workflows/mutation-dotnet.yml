name: Mutation (.NET)

# Stryker.NET mutates TingQR.Core (dotnet/stryker-config.json), TingQR.Rendering (dotnet/stryker-config.rendering.json),
# TingQR.AspNetCore (dotnet/stryker-config.aspnetcore.json) and TingQR.BankLogos (dotnet/stryker-config.banklogos.json),
# one matrix job each; a job fails if its score drops below `thresholds.break` in its config.
# One OS: the score is expected not to vary by platform; for Core, local runs on Windows (2026-11-22/23) and the first CI
# run on Ubuntu (PR #10, 2026-11-23) both passed; for Rendering, local runs on Windows (2026-11-23/24) and the job
# `mutation (rendering)` on Ubuntu (run 45330277776, main b684bca, 2026-11-24) both passed. AspNetCore and BankLogos
# (2026-11-24) have only been run locally on Windows; their jobs have not run on CI yet. The tests run on net10.0 only
# (net481 is Windows-only).
on:
  push:
    branches: [main]
    paths:
      - 'dotnet/**'
      - 'conformance/**'
      - '.github/workflows/mutation-dotnet.yml'
  pull_request:
    paths:
      - 'dotnet/**'
      - 'conformance/**'
      - '.github/workflows/mutation-dotnet.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: mutation (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Core and Rendering ~5 min each locally (2026-11-23)
    strategy:
      fail-fast: false  # report both scores even when one fails
      matrix:
        include:
          # Core runs from its own test project directory, so Stryker uses TingQR.Core.Tests only. From dotnet/ it
          # would also run TingQR.Rendering.Tests (it references Core), doubling the time past the 30-minute timeout
          # (cancelled on main 2026-11-24, run 45319736051).
          - project: core
            dir: dotnet/tests/TingQR.Core.Tests
            config: ../../stryker-config.json
          - project: rendering
            dir: dotnet
            config: stryker-config.rendering.json
          # From their own test project directories too: from dotnet/ Stryker would run every test project that
          # references the mutated one. ~1.5 and ~1 min locally (2026-11-24).
          - project: aspnetcore
            dir: dotnet/tests/TingQR.AspNetCore.Tests
            config: ../../stryker-config.aspnetcore.json
          - project: banklogos
            dir: dotnet/tests/TingQR.BankLogos.Tests
            config: ../../stryker-config.banklogos.json
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet tool restore
        working-directory: dotnet
      - run: dotnet tool run dotnet-stryker --config-file ${{ matrix.config }}
        working-directory: ${{ matrix.dir }}
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-dotnet-${{ matrix.project }}
          path: ${{ matrix.dir }}/StrykerOutput/
          if-no-files-found: ignore
