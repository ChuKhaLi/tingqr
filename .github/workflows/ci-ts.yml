name: CI (TypeScript)

on:
  push:
    branches: [main]
    paths:
      - 'ts/**'
      - 'conformance/**'
      - '.github/workflows/ci-ts.yml'
      - 'package.json'
      - '.gitattributes'
  pull_request:
    paths:
      - 'ts/**'
      - 'conformance/**'
      - '.github/workflows/ci-ts.yml'
      - 'package.json'
      - '.gitattributes'

permissions:
  contents: read

jobs:
  test:
    # Windows is tested for real, not for completeness: a payload or vector checked out with CRLF line
    # endings changes the CRC, and the owner works on Windows (.gitattributes keeps vectors byte-exact).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v5
      # No `version:` here: the action reads `packageManager` from the root package.json, and setting both
      # with different strings ("10" vs "10.34.1") makes it fail with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      - run: pnpm -C ts install --frozen-lockfile
      - run: pnpm -C ts typecheck
      - run: pnpm -C ts build
      - name: '@tingqr/core has no runtime/peer/optional dependencies and fits the size budget'
        run: node ts/scripts/check-core-package.mjs
      - name: '@tingqr/render depends only on @tingqr/core, keeps the Nayuki notice and fits the size budget'
        run: node ts/scripts/check-render-package.mjs
      - name: '@tingqr/bank-logos has no dependencies, ships LOGOS-NOTICE.md and LICENSE, and fits the size budget'
        run: node ts/scripts/check-bank-logos-package.mjs
      - run: pnpm -C ts test
      # The bank-list tool (conformance/tools/banks) never calls the network in its tests; sharp resizes a generated image.
      - run: pnpm -C conformance/tools/banks install --frozen-lockfile
      - run: pnpm -C conformance/tools/banks test
      - name: 'src/banks/data.ts matches conformance/banks/'
        run: node conformance/tools/banks/sync-ts.mjs --check
      # The recipe tool guards privacy (masking, never printing payloads); its tests use public README samples only.
      - run: pnpm -C conformance/tools/recipe install --frozen-lockfile
      - run: pnpm -C conformance/tools/recipe test
